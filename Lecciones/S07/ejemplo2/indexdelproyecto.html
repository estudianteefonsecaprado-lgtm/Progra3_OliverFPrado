<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarjeta de Presentacion Digital</title>

  <!-- Bootstrap 5 desde CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Hoja de estilos propia -->
  <link rel="stylesheet" href="css/estilos.css">

  <!-- Script propio: defer asegura que el HTML cargue antes -->
  <script src="js/script.js" defer></script>
</head>

<body class="bg-body-tertiary">

  <main class="container py-5">

    <!-- Tarjeta -->
    <article id="tarjeta" class="card shadow-sm mx-auto" style="max-width: 540px;">

      <div class="card-body p-4">

        <!-- Encabezado: saludo dinamico + boton de tema -->
        <div class="d-flex justify-content-between align-items-start mb-3">
          <div>
            <!-- El texto de este saludo lo escribe JavaScript -->
            <h1 id="saludo" class="h4 mb-1">Hola</h1>
            <p id="rol" class="text-secondary mb-0">Cargando...</p>
          </div>
          <button
            id="btn-tema"
            type="button"
            class="btn btn-outline-secondary btn-sm"
            aria-label="Cambiar entre modo claro y oscuro"
            aria-pressed="false">
            Modo oscuro
          </button>
        </div>

        <hr>

        <!-- Lista de habilidades: la genera JavaScript -->
        <section class="mb-4" aria-labelledby="titulo-habilidades">
          <h2 id="titulo-habilidades" class="h6 text-uppercase text-secondary">
            Habilidades
          </h2>
          <ul id="lista-habilidades" class="list-group list-group-flush">
            <!-- Los elementos li se agregan desde el script -->
          </ul>
        </section>

        <!-- Frase del dia: se obtiene con Fetch -->
        <section class="mb-4" aria-labelledby="titulo-frase">
          <h2 id="titulo-frase" class="h6 text-uppercase text-secondary">
            Frase del dia
          </h2>
          <blockquote id="frase" class="blockquote fs-6 mb-0">
            <p class="mb-0">Obteniendo una frase...</p>
          </blockquote>
        </section>

        <hr>

        <!-- Formulario de contacto con validacion por JavaScript -->
        <section aria-labelledby="titulo-contacto">
          <h2 id="titulo-contacto" class="h6 text-uppercase text-secondary">
            Contacto
          </h2>

          <form id="form-contacto" novalidate>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electronico</label>
              <input
                type="email"
                id="correo"
                class="form-control"
                placeholder="nombre@correo.com"
                aria-describedby="mensaje-correo"
                required>
              <!-- Mensaje de validacion controlado por JavaScript -->
              <div id="mensaje-correo" class="form-text" role="status" aria-live="polite"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Enviar
            </button>
          </form>
        </section>

      </div>
    </article>

  </main>

  <!-- Bootstrap 5 JS (bundle con Popper) -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    defer></script>
</body>
</html>
